services:
  - type: web
    name: nova-voice-backend
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn voice_agent.server:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PINECONE_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: VAPI_PRIVATE_API_KEY
        sync: false
      - key: VAPI_PUBLIC_KEY
        sync: false
      - key: VAPI_ASSISTANT_ID
        sync: false
